name: Build SuLMod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Build mod pakai Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'latest'
          target: Android64

      - name: Upload hasil .geode sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuLMod-android
          path: build/*.geode
