name: Build SuLMod

# Jalan otomatis tiap kali ada push ke branch main,
# atau bisa dipicu manual lewat tab Actions (tombol "Run workflow")
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Build untuk Android (cocok buat dipasang di Geode versi HP)
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Build mod pakai Geode SDK
        uses: geode-sdk/build-geode-mod@main
        with:
          platform: android64
          # Kalau butuh target android32 juga, tambahin job terpisah dengan platform: android32

      - name: Upload hasil .geode sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuLMod-android
          path: build/*.geode
